name: Post Instagram 18h

on:
  schedule:
    - cron: "40 15 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Générer et publier tout de suite (ignore l'heure)"
        type: boolean
        default: false
      dry_run:
        description: "Test : générer sans publier"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gpt-image-2' }}
      TEXT_MODEL: ${{ vars.TEXT_MODEL || 'gpt-5-mini' }}
      DRY_RUN: ${{
